name: Sync IPO market data
on:
  schedule:
    - cron: '17 2-14 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ipo-market-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Standard library only: no Python dependency installation required.
      - name: Test ingestion
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Fetch and normalize
        env:
          IPO_USER_AGENT: IPOFamilyDashboard/1.0 (+https://github.com/${{ github.repository }})
        run: python scripts/sync-data.py
      - name: Validate static data
        run: python scripts/sync-data.py --validate
      - name: Commit meaningful changes only
        shell: bash
        run: |
          if git diff --quiet -- data/latest.json; then
            echo "No meaningful changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/snapshots/
          git commit -m "data: refresh IPO market snapshot"
          git push
